name: Build all ports

on:
  push:
    branches: [main, 1.21]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mc:
          - version: 1.21.11
            stock: libs/original-baritone-meteor-1.21.11.jar
          - version: 1.21.6
            stock: libs/stock-baritone-fabric-1.21.6.jar
          - version: 1.21.4
            stock: libs/stock-baritone-fabric-1.21.4.jar
          - version: 1.21.1
            stock: libs/stock-baritone-fabric-1.21.1.jar
          - version: 1.21
            stock: libs/baritone-unoptimized-fabric-1.21.jar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Enable Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ matrix.mc.version }}-${{ hashFiles('build.gradle', 'gradle.properties', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ matrix.mc.version }}-
            gradle-

      - name: Fetch Minecraft deps (${{ matrix.mc.version }})
        shell: pwsh
        run: ./ports/fetch-deps.ps1 -Version ${{ matrix.mc.version }} -OutDir ports/cache/${{ matrix.mc.version }}

      - name: Build merged intermediary jar (${{ matrix.mc.version }})
        shell: pwsh
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}
        run: |
          ./gradlew makeIntermediary --console=plain `
            -Pport_version=${{ matrix.mc.version }} `
            -Pport_client=ports/cache/${{ matrix.mc.version }}/client.jar `
            -Pport_server=ports/cache/${{ matrix.mc.version }}/server.jar `
            -Pport_mappings=ports/cache/${{ matrix.mc.version }}/intermediary.tiny `
            -Pport_out=ports/cache/${{ matrix.mc.version }}/minecraft-merged-intermediary.jar

      - name: Build mod (${{ matrix.mc.version }})
        shell: pwsh
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}
          MC_VERSION: ${{ matrix.mc.version }}
          MC_STOCK_BARITONE_JAR: ${{ matrix.mc.stock }}
          MC_INTERMEDIARY_JAR: ports/cache/${{ matrix.mc.version }}/minecraft-merged-intermediary.jar
          MC_MODMENU_JAR: libs/modmenu-17.0.1.jar
        run: ./gradlew build --console=plain -x test

      - name: Verify anchors (${{ matrix.mc.version }})
        shell: pwsh
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}
          MC_VERSION: ${{ matrix.mc.version }}
          MC_STOCK_BARITONE_JAR: ${{ matrix.mc.stock }}
          MC_INTERMEDIARY_JAR: ports/cache/${{ matrix.mc.version }}/minecraft-merged-intermediary.jar
          MC_MODMENU_JAR: libs/modmenu-17.0.1.jar
        run: ./gradlew verifyAnchors --console=plain

      - name: Upload artifacts (${{ matrix.mc.version }})
        uses: actions/upload-artifact@v4
        with:
          name: baritone-${{ matrix.mc.version }}
          path: build/libs/baritone-${{ matrix.mc.version }}-SNAPSHOT.*.jar
          if-no-files-found: error
