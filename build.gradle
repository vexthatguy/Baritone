tasks.register('renameJar', JavaExec) {
    group = 'build'
    description = 'Renames the stock Baritone jar to com.vex.baritone.* (pure Baritone).'
    dependsOn tasks.named('compileToolsJava')
    classpath = sourceSets.tools.output + configurations.asmTool
    mainClass = 'com.vex.tools.RenameJar'
    args = [
        file('libs/original-baritone-meteor-1.21.11.jar').absolutePath,
        layout.buildDirectory.file('libs/baritone-1.21.11-SNAPSHOT.jar').get().asFile.absolutePath,
        sourceSets.tools.output.classesDirs.singleFile.absolutePath
    ]
}

tasks.register('compileUi', JavaCompile) {
    group = 'build'
    description = 'Compiles the Baritone config GUI classes.'
    dependsOn tasks.named('renameJar')
    source = sourceSets.ui.java
    classpath = sourceSets.ui.compileClasspath
    destinationDirectory = layout.buildDirectory.dir('uiclasses')
    options.encoding = 'UTF-8'
    options.release = 21
