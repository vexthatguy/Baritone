sourceSets {
    // The default main source set is unused; UI code compiles via 'ui'.
    main {
        java.srcDirs = []
        resources.srcDirs = []
    }
    tools {
        java.srcDir 'src/tools/java'
        compileClasspath += files(mcIntermediaryJar)
        compileClasspath += configurations.asmTool
        compileClasspath += configurations.remapper
    }
    ui {
        java.srcDir 'src/main/java'
        def profileOf = [
            '1.21.2': '1.21.4',
            '1.21.3': '1.21.4',
            '1.21.5': '1.21.4',
            '1.21.7': '1.21.6',
            '1.21.8': '1.21.6'
        ]
        def versionOverlay = file("src/version/$mcVersion/java")
        def classicOverlay = file("src/version/1.21/java")
        if (versionOverlay.exists()) {
            java.srcDir versionOverlay
        } else if (profileOf.containsKey(mcVersion)) {
            java.srcDir file("src/version/${profileOf[mcVersion]}/java")
        } else if (classicOverlay.exists()) {
            java.srcDir classicOverlay
        }
        java.include 'com/vex/baritone/**'
        compileClasspath += files(mcIntermediaryJar)
        compileClasspath += files(renamedJar)
        compileClasspath += files(modmenuJar)
        compileClasspath += mcLibs
    }
}

repositories {
    mavenCentral()
    maven {
        url 'https://maven.fabricmc.net/'
    }
}

dependencies {
    asmTool 'org.ow2.asm:asm:9.10.1'
    asmTool 'org.ow2.asm:asm-commons:9.10.1'
    asmTool 'org.ow2.asm:asm-tree:9.10.1'
    remapper 'net.fabricmc:tiny-remapper:0.15.0'
    remapper 'org.ow2.asm:asm:9.10.1'
    remapper 'org.ow2.asm:asm-tree:9.10.1'
    remapper 'org.ow2.asm:asm-commons:9.10.1'
}

tasks.register('makeIntermediary', JavaExec) {
    group = 'port'
    description = 'Builds a merged intermediary Minecraft jar from Mojang client+server jars and the intermediary v2 mapping.'
    dependsOn tasks.named('compileToolsJava')
    classpath = sourceSets.tools.output + configurations.remapper
    mainClass = 'com.vex.tools.MakeIntermediary'
    def portVersion = providers.gradleProperty('port_version').orElse('1.21').get()
    def portClient = providers.gradleProperty('port_client').orElse("ports/cache/$portVersion/client.jar").get()
    def portServer = providers.gradleProperty('port_server').orElse("ports/cache/$portVersion/server.jar").get()
    def portMappings = providers.gradleProperty('port_mappings').orElse("ports/cache/$portVersion/intermediary.tiny").get()
    def portOut = providers.gradleProperty('port_out').orElse("ports/cache/$portVersion/minecraft-merged-intermediary.jar").get()
    args = [
        file(portClient).absolutePath,
        file(portServer).absolutePath,
        file(portMappings).absolutePath,
        file("ports/cache/$portVersion/merged.jar").absolutePath,
        file(portOut).absolutePath
    ]
}

tasks.register('renameJar', JavaExec) {
    group = 'build'
    description = 'Renames the stock Baritone jar to com.vex.baritone.* (pure Baritone).'
    dependsOn tasks.named('compileToolsJava')
    classpath = sourceSets.tools.output + configurations.asmTool
    mainClass = 'com.vex.tools.RenameJar'
    args = [
        file(stockBaritoneJar).absolutePath,
        renamedJar.absolutePath,
        sourceSets.tools.output.classesDirs.singleFile.absolutePath
    ]
}

tasks.register('compileUi', JavaCompile) {
    group = 'build'
    description = 'Compiles the Baritone config GUI classes.'
    dependsOn tasks.named('renameJar')
    source = sourceSets.ui.java
    classpath = sourceSets.ui.compileClasspath
    destinationDirectory = layout.buildDirectory.dir('uiclasses')
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.register('patchBaritone', JavaExec) {
    group = 'build'
    description = 'Applies small ASM patches (thisway walk fix, farm crop list, provider/command gates).'
    dependsOn tasks.named('renameJar'), tasks.named('compileToolsJava')
    classpath = sourceSets.tools.output + configurations.asmTool + files(renamedJar) + files(mcIntermediaryJar) + mcLibs
    mainClass = 'com.vex.tools.PatchBaritone'
    args = [
        renamedJar.absolutePath,
        layout.buildDirectory.file('libs/baritone-patched.jar').get().asFile.absolutePath
    ]
    if (System.getenv('MC_NO_FRAMES') == '1') {
        jvmArgs '-DBT_NO_FRAMES=1'
    }
}

tasks.register('verifyAnchors', JavaExec) {
    group = 'build'
    description = 'Verifies every ASM anchor PatchBaritone/UI relies on in the final stamped jar.'
    dependsOn tasks.named('stampJar'), tasks.named('compileToolsJava')
    classpath = sourceSets.tools.output + configurations.asmTool + files(mcIntermediaryJar) + mcLibs
    mainClass = 'com.vex.tools.VerifyAnchors'
    doFirst {
        def dir = layout.buildDirectory.dir('libs').get().asFile
        def finals = dir.listFiles().findAll { it.name ==~ /baritone-${mcVersion}-SNAPSHOT\.\d+\.jar/ }
        def num = { String n -> (n =~ /\.(\d+)\.jar$/)[0][1] as int }
        finals.sort { a, b -> num(a.name) <=> num(b.name) }
        def jar = finals.isEmpty() ? null : finals.last()
        args = [
            (jar != null ? jar.absolutePath : 'MISSING-FINAL-JAR'),
            mcVersion
        ]
    }
}

tasks.register('remapUi', JavaExec) {
    group = 'port'
    description = 'Remaps compiled UI classes from intermediary to a target namespace (Forge/NeoForge).'
    dependsOn tasks.named('compileUi'), tasks.named('compileToolsJava')
    classpath = sourceSets.tools.output + configurations.remapper
    mainClass = 'com.vex.tools.RemapClasses'
    args = [
        layout.buildDirectory.dir('uiclasses').get().asFile.absolutePath,
        file("ports/cache/$mcVersion/yarn.tiny").absolutePath,
        'intermediary',
        'named',
        layout.buildDirectory.dir('forge-ui').get().asFile.absolutePath
    ]
}

int nextBuildNumber() {
    def f = layout.buildDirectory.file('version.properties').get().asFile
    def props = new Properties()
    int n = 1
    if (f.exists()) {
        f.withInputStream { props.load(it) }
        n = (props.getProperty('buildNumber', '1') as int) + 1
    }
    props.setProperty('buildNumber', n.toString())
    f.parentFile.mkdirs()
    f.withOutputStream { props.store(it, 'Baritone build counter') }
    return n
}

tasks.register('stampJar', JavaExec) {
    group = 'build'
    description = 'Writes the final jar with bumped version, UI classes and modmenu entrypoint.'
    dependsOn tasks.named('patchBaritone'), tasks.named('compileUi'), tasks.named('compileToolsJava')
    classpath = sourceSets.tools.output + configurations.asmTool
    mainClass = 'com.vex.tools.StampVersion'
    doFirst {
        def num = nextBuildNumber()
        args = [
            layout.buildDirectory.file('libs/baritone-patched.jar').get().asFile.absolutePath,
            layout.buildDirectory.file("libs/baritone-${mcVersion}-SNAPSHOT.${num}.jar").get().asFile.absolutePath,
            "${mcVersion}-SNAPSHOT.${num}",
            layout.buildDirectory.dir('uiclasses').get().asFile.absolutePath,
            file('assets').absolutePath,
            file('src/main/resources').absolutePath
        ]
    }
}

// The default build emits the final jar.
tasks.named('build') {
    dependsOn tasks.named('stampJar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
