plugins {
    id 'java'
}

group = 'com.vex'
version = '1.21.11-SNAPSHOT'

configurations {
    asmTool
    remapper
}

// ---------------------------------------------------------------------------
// Version/loader target. Override via -P, environment variables, or
// gradle.properties. Precedence: env > gradle.properties > default.
// ---------------------------------------------------------------------------
def envOrProp = { String env, String prop, def dflt ->
    String e = System.getenv(env)
    if (e != null && !e.isBlank()) return e
    def p = providers.gradleProperty(prop)
    return p.isPresent() ? p.get() : dflt
}

def mcVersion = envOrProp('MC_VERSION', 'mc_version', '1.21.11')
def stockBaritoneJar = envOrProp('MC_STOCK_BARITONE_JAR', 'stock_baritone_jar',
        'libs/original-baritone-meteor-1.21.11.jar')
def mcIntermediaryJarPath = envOrProp('MC_INTERMEDIARY_JAR', 'mc_intermediary_jar', null)
def modmenuJar = envOrProp('MC_MODMENU_JAR', 'modmenu_jar', 'libs/modmenu-17.0.1.jar')

if (mcIntermediaryJarPath == null) {
    throw new GradleException("mc_intermediary_jar is not set; provide -Pmc_intermediary_jar=... or set MC_INTERMEDIARY_JAR")
}

def mcIntermediaryJar = file(mcIntermediaryJarPath)
def renamedJarName = "renamed-baritone-${mcVersion}-SNAPSHOT.jar"
def renamedJar = layout.buildDirectory.file("libs/$renamedJarName").get().asFile

// Shared third-party compile/runtime libraries (MC-agnostic).
